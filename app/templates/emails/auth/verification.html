{% extends "emails/layouts/base.html" %} {% block content %}

<h2>Verify Your Email</h2>

<p>Hello <strong>{{ name }}</strong>,</p>

<p>
  Thank you for joining Rubel Mart. Use the verification code below to activate
  your account.
</p>

<div
  style="
    margin: 30px 0;
    padding: 25px;
    text-align: center;
    background: #f8f5ff;
    border: 2px dashed #7b00ff;
    border-radius: 16px;
  "
>
  <span
    style="
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #7b00ff;
    "
  >
    {{ otp }}
  </span>
</div>

<p>
  This code expires in
  <strong>10 minutes</strong>.
</p>

<div
  style="
    margin-top: 25px;
    padding: 16px;
    background: #fff7ed;
    border-left: 4px solid #f59e0b;
  "
>
  🔒 Never share this code with anyone.
</div>

{% endblock %}
