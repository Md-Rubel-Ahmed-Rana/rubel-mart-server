{% extends "emails/layouts/base.html" %} {% block content %}

<h2>Password Reset Request</h2>

<p>Hello <strong>{{ name }}</strong>,</p>

<p>We received a request to reset your password. Use the code below:</p>

<div
  style="
    margin: 30px 0;
    padding: 25px;
    text-align: center;
    background: #f8f5ff;
    border: 2px dashed #7b00ff;
    border-radius: 16px;
  "
>
  <span
    style="
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #7b00ff;
    "
  >
    {{ otp }}
  </span>
</div>

<div
  style="
    margin-top: 20px;
    padding: 16px;
    background: #fef2f2;
    border-left: 4px solid #ef4444;
  "
>
  If you didn't request this password reset, please ignore this email.
</div>

{% endblock %}
